<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="manifest" href='data:application/json,{"name":"Iron Log","short_name":"Iron Log","display":"standalone","background_color":"%2309090b","theme_color":"%2309090b","icons":[]}'>
<title>Iron Log</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b; --bg2:#0d0d0f; --card:#151517; --card2:#1b1b1e; --line:#242427; --line2:#38383d;
    --txt:#f3f2ef; --mut:#9c9892; --mut2:#67635e;
    --amber:#eea310; --amber2:#c9840a; --amber-dim:rgba(238,163,16,.13);
    --green:#33c98a; --green-dim:rgba(51,201,138,.13); --red:#ef5652; --red-dim:rgba(239,86,82,.13);
    --steel:#7c8a99;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:
      radial-gradient(600px 300px at 15% -80px, rgba(238,163,16,.14), transparent 60%),
      radial-gradient(500px 260px at 100% 140px, rgba(51,201,138,.06), transparent 55%),
      radial-gradient(700px 420px at 50% 100%, rgba(238,163,16,.05), transparent 60%),
      var(--bg);
    color:var(--txt);font-family:Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:96px;min-height:100vh}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px}
  .disp{font-family:'Barlow Condensed',sans-serif;letter-spacing:.008em;font-variant-numeric:tabular-nums}
  .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--mut2);font-weight:600;
    display:flex;align-items:center;gap:6px}
  .eyebrow svg{width:13px;height:13px;flex:0 0 auto;opacity:.85}
  .card{background:linear-gradient(165deg,var(--card2),var(--card) 65%);border:1px solid var(--line);border-radius:19px;
    padding:16px;margin-bottom:12px;position:relative;overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 14px 30px -20px rgba(0,0,0,.75);
    animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
  .card::before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent)}
  @keyframes rise{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  .row{display:flex;align-items:center;justify-content:space-between}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
  input,select,textarea{font-family:inherit;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;color:var(--txt);font-size:15px;outline:none;transition:box-shadow .15s,border-color .15s;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
  input:focus,textarea:focus,select:focus{box-shadow:inset 0 1px 2px rgba(0,0,0,.3), 0 0 0 3px var(--amber-dim);border-color:var(--amber)}
  .btn{width:100%;padding:13px;border-radius:13px;background:var(--card2);border:1px solid var(--line);color:var(--mut);
    font-weight:600;font-size:14px;transition:transform .12s,filter .12s;letter-spacing:.01em;position:relative}
  .btn:active{transform:scale(.97);filter:brightness(.94)}
  .btn.amber{background:linear-gradient(180deg,#f8b83a,var(--amber) 55%,var(--amber2));color:#1a1206;border:none;
    box-shadow:0 6px 18px -6px rgba(238,163,16,.55), inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.green{background:linear-gradient(180deg,#57e6a8,var(--green) 55%,#1fa878);color:#062015;border:none;
    box-shadow:0 6px 18px -6px rgba(51,201,138,.5), inset 0 1px 0 rgba(255,255,255,.3)}
  .pill{font-size:10.5px;padding:4px 10px;border-radius:99px;font-weight:600;letter-spacing:.03em}
  .pill.amber{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(238,163,16,.25)}
  .pill.grey{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
  .hdr{padding:20px 0 14px}
  .check{width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:13px;flex:0 0 auto;border:1.5px solid var(--line2);color:transparent;transition:.18s cubic-bezier(.3,1.5,.5,1)}
  .check.on{background:linear-gradient(180deg,#3fdc9c,var(--green));color:#062015;border-color:transparent;transform:scale(1.06)}
  .meal{display:flex;gap:12px;align-items:flex-start;padding:9px 0;text-align:left;width:100%}
  .strike{color:var(--mut2);text-decoration:line-through}
  .bar{height:7px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px 0 4px;border:1px solid var(--line);position:relative}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--amber2),var(--amber));transition:width .6s cubic-bezier(.2,.8,.2,1);
    position:relative;overflow:hidden}
  .bar > i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
    width:40%;animation:shimmer 2.4s ease-in-out infinite}
  @keyframes shimmer{0%{transform:translateX(-120%)}100%{transform:translateX(340%)}}
  .wglass{flex:1;height:34px;border-radius:8px;background:var(--card2);border:1px solid var(--line);transition:.15s}
  .wglass.on{background:linear-gradient(180deg,#f5b02a,var(--amber));border-color:transparent;box-shadow:0 3px 10px -4px rgba(238,163,16,.6)}
  .seg{flex:1;padding:9px 0;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--mut2);font-size:14px;text-align:center;transition:.15s}
  .seg.on{background:linear-gradient(180deg,#f5b02a,var(--amber));color:#1a1206;font-weight:700;border-color:transparent}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20}
  nav::before{content:'';position:absolute;top:-24px;left:0;right:0;height:24px;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(10,10,11,.5))}
  nav .bar2{max-width:480px;margin:0 auto;background:rgba(13,13,15,.88);backdrop-filter:blur(18px) saturate(160%);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);position:relative}
  nav button{flex:1;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut2);position:relative;transition:color .18s,transform .18s}
  nav button.on{color:var(--amber);transform:translateY(-1px)}
  nav button.on::before{content:'';position:absolute;top:0px;width:30px;height:28px;border-radius:10px;
    background:radial-gradient(circle,var(--amber-dim),transparent 75%);z-index:-1}
  nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
  nav button.on svg{transform:scale(1.08)}
  nav .lb{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  .bub{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .bub.me{background:linear-gradient(180deg,#f5b02a,var(--amber));color:#1a1206;border-bottom-right-radius:5px}
  .bub.ai{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .chip{font-size:12px;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
  .save{font-size:11px;color:var(--green);opacity:0;transition:.3s;font-weight:600}
  .save.show{opacity:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  a{color:var(--amber)}
  .mut{color:var(--mut)} .mut2{color:var(--mut2)} .sm{font-size:13px} .xs{font-size:11px}
  .plate{width:60px;height:60px;border-radius:99px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 32% 28%, #26262a, #111113 72%);border:1px solid var(--line2);position:relative;
    box-shadow:inset 0 0 0 3px var(--bg), inset 0 0 0 4px var(--line2), inset 0 -6px 10px -6px rgba(0,0,0,.6), 0 8px 20px -10px rgba(0,0,0,.75)}
  .plate::before{content:'';position:absolute;inset:-2px;border-radius:99px;padding:2px;
    background:conic-gradient(from 0deg, var(--amber), transparent 30%, transparent 70%, var(--amber));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    opacity:.55; animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .plate::after{content:'';position:absolute;width:17px;height:17px;border-radius:99px;background:var(--bg);border:1px solid var(--line2);z-index:2}
  .plate .pv{position:relative;z-index:3;font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--amber);text-align:center;line-height:1.05}
  #app{animation:fadein .3s ease both}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  ::selection{background:var(--amber-dim);color:var(--amber)}
</style>
</head>
<body>

<div id="app"><div class="wrap" style="padding-top:40vh;text-align:center;color:var(--mut2)">Loading…</div></div>

<nav id="nav" style="display:none"><div class="bar2">
  <button data-tab="today"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lb">Today</span></button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="14 6 21 6 21 13"/></svg><span class="lb">Progress</span></button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg><span class="lb">Report</span></button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg><span class="lb">Plan</span></button>
  <button data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg><span class="lb">Goals</span></button>
</div></nav>

<script>
/* ============ CONFIG / STATE ============ */
const LS_URL = 'ironlog_api_url';
let API_URL = localStorage.getItem(LS_URL) || '';
let S = { profile:{}, today:null, logs:[], chat:[], measurements:[], photos:[] };
let TAB = 'today';
let saveTimer = null;

const todayKey = () => new Date().toISOString().slice(0,10);
function emptyDay(){ return { date:todayKey(), weight:'', water:0, workoutDone:false, workoutNotes:'', energy:0, sleep:'', meals:{}, ex:{}, foods:[], steps:'', duration:'', customEx:[] }; }

/* ============ DATA ============ */
const MEALS = [
  {id:'m1',time:'9:45 AM',label:'3 boiled eggs + banana',tag:'~21g protein'},
  {id:'m2',time:'1:15 PM',label:'2 chapati + dal + 100g chicken/paneer + sabzi',tag:"lunch — don't skip"},
  {id:'m3',time:'4:00 PM',label:'Roasted chana / apple + almonds / boiled egg',tag:'snack'},
  {id:'m4',time:'7:00 PM',label:'Pre-workout: banana + 2 eggs OR whey',tag:'fuel'},
  {id:'m5',time:'9:45 PM',label:'Post-workout: whey + chicken/eggs + 1 chapati',tag:'recovery'},
  {id:'m6',time:'11:00 PM',label:'Haldi milk / makhana / dates only',tag:'craving fix'},
];
// Indian food bank — [name, default qty label, kcal, protein g] per that default serving
const FOOD_DB = [
  {n:'Boiled egg',u:'1 pc',k:70,p:6},
  {n:'Egg bhurji (2 eggs)',u:'1 serving',k:180,p:13},
  {n:'Roti / chapati',u:'1 pc',k:100,p:3},
  {n:'Bhakri (jowar/bajra)',u:'1 pc',k:120,p:3},
  {n:'Cooked rice',u:'1 katori (150g)',k:195,p:4},
  {n:'Dal (cooked)',u:'1 katori',k:150,p:8},
  {n:'Rajma / chole (cooked)',u:'1 katori',k:180,p:10},
  {n:'Paneer',u:'100g',k:265,p:18},
  {n:'Chicken curry (boneless)',u:'100g',k:180,p:27},
  {n:'Fish curry',u:'100g',k:150,p:20},
  {n:'Sabzi (mixed veg)',u:'1 katori',k:120,p:3},
  {n:'Palak / methi sabzi',u:'1 katori',k:90,p:4},
  {n:'Dahi (curd)',u:'100g',k:60,p:3.5},
  {n:'Milk',u:'250ml',k:150,p:8},
  {n:'Banana',u:'1 medium',k:105,p:1.3},
  {n:'Apple',u:'1 medium',k:95,p:0.5},
  {n:'Roasted chana',u:'30g',k:120,p:7},
  {n:'Peanuts',u:'30g',k:170,p:7},
  {n:'Almonds',u:'10 pc',k:70,p:2.5},
  {n:'Makhana (roasted)',u:'30g',k:105,p:3.5},
  {n:'Dates (khajoor)',u:'3 pc',k:70,p:0.6},
  {n:'Poha',u:'1 plate',k:250,p:5},
  {n:'Upma',u:'1 plate',k:230,p:6},
  {n:'Oats (cooked)',u:'40g dry',k:150,p:5.4},
  {n:'Besan chilla',u:'1 pc (50g besan)',k:180,p:10},
  {n:'Sprouts',u:'1 katori',k:100,p:8},
  {n:'Black coffee',u:'1 cup',k:5,p:0},
  {n:'Tea with milk',u:'1 cup',k:60,p:1.5},
  {n:'Whey protein',u:'1 scoop',k:120,p:24},
  {n:'Buttermilk (chaas)',u:'1 glass',k:40,p:2},
  {n:'Cooking oil / ghee',u:'1 tsp',k:45,p:0},
];

const PPL = {
  0:{name:'Rest + Walk',focus:'Recovery',rest:true,
     warmup:[],ex:[],stretch:['30 min easy walk','Full-body light stretch 10 min']},
  1:{name:'Push',focus:'Chest + Triceps',
     warmup:['5 min incline walk / cycle','Arm circles + shoulder rolls 1 min','10 slow pushups','2 light warmup sets of first exercise'],
     ex:['Flat barbell / DB press 4×8','Incline DB press 3×10','Machine chest press 3×12','Cable fly 3×12','Overhead tricep extension 3×12','Rope pushdown 3×15'],
     stretch:['Chest doorway stretch 30s ×2','Overhead tricep stretch 30s each','Cross-body shoulder stretch 30s each']},
  2:{name:'Pull',focus:'Back + Biceps',
     warmup:['5 min rowing machine / cycle','Band pull-aparts 2×15','2 light sets lat pulldown'],
     ex:['Lat pulldown / pull-up 4×8','Barbell row 4×8','Seated cable row 3×10','Face pull 3×15','Barbell curl 3×12','Incline DB curl 3×12 (long head)'],
     stretch:['Lat hang / stretch 30s ×2','Biceps wall stretch 30s each','Child\u2019s pose 45s']},
  3:{name:'Legs',focus:'Legs + Abs',
     warmup:['5 min cycle','Leg swings 10 each','15 bodyweight squats','2 light sets of squat'],
     ex:['Squat 4×8','Leg press 3×12','Romanian deadlift 3×10','Leg curl 3×12','Leg extension 3×12','Calf raise 4×15','Hanging leg raise 3×15','Cable crunch 3×15'],
     stretch:['Quad stretch 30s each','Hamstring stretch 30s each','Hip flexor lunge stretch 30s each','Calf stretch 30s each']},
  4:{name:'Push',focus:'Shoulders + Triceps',
     warmup:['5 min cycle','Band pull-aparts 2×15','Light lateral raises 2×15','2 light sets overhead press'],
     ex:['Overhead press 4×8','Lateral raise 4×15','Rear delt fly 3×15','Front raise 3×12','Close-grip press / dips 3×12','Rope pushdown 3×12'],
     stretch:['Cross-body shoulder stretch 30s each','Overhead tricep stretch 30s each','Neck rolls 30s']},
  5:{name:'Pull',focus:'Back + Biceps',
     warmup:['5 min rowing machine / cycle','Band pull-aparts 2×15','2 light sets of deadlift'],
     ex:['Deadlift / rack pull 4×6','Lat pulldown 3×10','Seated cable row 3×12','Shrugs 3×15','Hammer curl 3×12','Preacher / concentration curl 3×12 (short head)'],
     stretch:['Lat hang / stretch 30s ×2','Lower back cat-cow 1 min','Biceps wall stretch 30s each']},
  6:{name:'Legs',focus:'Legs + Cardio',
     warmup:['5 min cycle','Leg swings 10 each','15 bodyweight squats'],
     ex:['Hack / front squat 4×8','Walking lunge 3×12','Leg extension 3×15','Leg curl 3×12','Calf raise 4×20','Cardio 15–20 min (incline walk)'],
     stretch:['Quad stretch 30s each','Hamstring stretch 30s each','Calf stretch 30s each']},
};
const PHASES = [
  {n:1,m:'Month 1–4',t:'Foundation + Fat Loss',g:'94.7 → ~85 kg'},
  {n:2,m:'Month 5–8',t:'Aggressive Cut + Conditioning',g:'78–80 kg, abs visible'},
  {n:3,m:'Month 9–16',t:'Lean Bulk + Muscle',g:'Get a Pune bodybuilding coach'},
  {n:4,m:'Month 17–18',t:'Peak Week + Compete',g:"Men's Physique — IBBF Maharashtra"},
];

function weekNo(){ const s=new Date((S.profile.startDate||todayKey())+'T00:00:00'); const d=Math.floor((new Date()-s)/864e5); return Math.max(1,Math.floor(d/7)+1); }
function calcStreak(){
  // consecutive days (ending today or yesterday) with workout done or food logged
  const byDate={}; S.logs.forEach(l=>byDate[l.date]=l);
  let streak=0; let d=new Date();
  // if today not yet logged, start checking from yesterday
  const t=byDate[todayKey()];
  const todayActive = t && (t.workoutDone || (t.foods&&t.foods.length));
  if(!todayActive) d.setDate(d.getDate()-1);
  for(;;){
    const key=d.toISOString().slice(0,10);
    const l=byDate[key];
    const isSun=d.getDay()===0;
    const active = l && (l.workoutDone || (l.foods&&l.foods.length));
    if(active || (isSun && l)) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}
function last7Days(){
  const days=[]; const byDate={}; S.logs.forEach(l=>byDate[l.date]=l);
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i);
    const key=d.toISOString().slice(0,10); const l=byDate[key];
    let status='future';
    if(d.getDay()===0) status = l ? 'rest-logged' : (key<=todayKey()?'rest':'future');
    else if(l&&l.workoutDone) status='done';
    else if(key<todayKey()) status='missed';
    else if(key===todayKey()) status='today';
    days.push({key,label:'SMTWTFS'[d.getDay()],date:d.getDate(),status});
  }
  return days;
}
function workoutToday(){ const w=weekNo(), day=new Date().getDay();
  if(w<=3 && !S.profile.skipTrainer){ const alt=day%2===0; return {name:'Trainer Plan',focus:alt?'Full Body':'Cardio + Core',rest:day===0,
    warmup:['5 min cardio','Light mobility'],ex:["Follow your gym trainer's plan",'Full body + cardio on alternate days'],stretch:['Light full-body stretch']}; }
  return PPL[day]; }

/* ============ API ============ */
async function api(action, payload){
  if(!API_URL) throw new Error('no-url');
  const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({action}, payload)) });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
function queueSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{
  try{ await api('saveDay',{day:S.today}); flashSaved(); }catch(e){ console.warn(e); }
},600); }
function flashSaved(){ const el=document.getElementById('savemark'); if(el){ el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1200);} }

/* ============ BOOT ============ */
async function boot(){
  if(!API_URL){ renderSetup(); return; }
  try{
    const d = await api('bootstrap',{});
    S.profile = d.profile || {};
    S.logs = d.logs || []; S.chat = d.chat || []; S.measurements = d.measurements||[]; S.photos=d.photos||[];
    const t = S.logs.find(l=>l.date===todayKey());
    S.today = t ? normalizeDay(t) : emptyDay();
    document.getElementById('nav').style.display='block';
    bindNav(); render();
  }catch(e){
    renderSetup('Couldn\'t reach your backend. Check the URL.');
  }
}
function normalizeDay(t){ return { date:t.date, weight:t.weight||'', water:+t.water||0, workoutDone:!!t.workoutDone,
  workoutNotes:t.workoutNotes||'', energy:+t.energy||0, sleep:t.sleep||'', meals:t.meals||{}, ex:t.ex||{}, foods:t.foods||[], steps:t.steps||'', duration:t.duration||'', customEx:t.customEx||[] }; }
function prMax(name){
  // best (max weight) ever logged for this exercise, excluding today — for PR comparison
  let best=null;
  for(const l of S.logs){ if(l.date===todayKey()) continue;
    const e=(l.ex||{})[name]; const w=e&&parseFloat(e.w);
    if(w && (!best || w>best.w)) best={w,r:e.r,date:l.date};
    (l.customEx||[]).forEach(c=>{ if(c.n===name){ const cw=parseFloat(c.w); if(cw&&(!best||cw>best.w)) best={w:cw,r:c.r,date:l.date}; } });
  }
  return best;
}
function allPRs(){
  // across full history (incl today), the max weight ever logged per exercise name
  const map={};
  S.logs.forEach(l=>{
    Object.entries(l.ex||{}).forEach(([name,e])=>{ const w=parseFloat(e.w);
      if(w && (!map[name] || w>map[name].w)) map[name]={w,r:e.r,date:l.date}; });
    (l.customEx||[]).forEach(c=>{ const w=parseFloat(c.w);
      if(w && (!map[c.n] || w>map[c.n].w)) map[c.n]={w,r:c.r,date:l.date}; });
  });
  return Object.entries(map).map(([name,v])=>({name,...v})).sort((a,b)=>b.w-a.w);
}

function computeConsistency(weeks){
  const out=[]; const byDate={}; S.logs.forEach(l=>byDate[l.date]=l);
  for(let wk=weeks-1; wk>=0; wk--){
    let done=0, target=0;
    for(let d=0; d<7; d++){
      const dt=new Date(); dt.setDate(dt.getDate()-(wk*7)-(dt.getDay())+d);
      if(dt>new Date()) continue;
      const key=dt.toISOString().slice(0,10); const isSun=dt.getDay()===0;
      if(!isSun){ target++; if(byDate[key]&&byDate[key].workoutDone) done++; }
    }
    out.push({label:'Wk '+(weeks-wk), pct: target?Math.round(done/target*100):0});
  }
  return out;
}

function statRow(l,v,a){ return `<div class="row" style="margin:5px 0"><span class="eyebrow">${l}</span>
  <span class="disp" style="font-size:18px;${a?'color:var(--amber)':''}">${v}</span></div>`; }
function measInput(id,l,v,prev){
  let deltaHtml='';
  if(v && prev){ const d=(parseFloat(v)-parseFloat(prev)).toFixed(1);
    const goodDown = id==='waist'; // waist: smaller is better; chest/arm/thigh: bigger is better (muscle gain)
    const isGood = goodDown ? d<0 : d>0;
    if(d!=0) deltaHtml=`<div class="xs" style="text-align:center;margin-top:3px;color:${isGood?'var(--green)':'var(--red)'}">${d>0?'+':''}${d}</div>`; }
  return `<div><div class="xs mut2" style="margin-bottom:5px;text-align:center">${l}</div>
  <input class="meas" data-m="${id}" inputmode="decimal" value="${v||''}" style="text-align:center;padding:9px 4px">${deltaHtml}</div>`; }
function ringSvg(pct,big){ const r=50,c=2*Math.PI*r,off=c-pct/100*c;
  return `<svg width="132" height="132" viewBox="0 0 124 124">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f8c04a"/><stop offset="100%" stop-color="var(--amber2)"/>
      </linearGradient>
      <filter id="ringGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g transform="rotate(-90 62 62)">
      <circle cx="62" cy="62" r="${r}" stroke="#232326" stroke-width="11" fill="none"/>
      <circle cx="62" cy="62" r="${r}" stroke="url(#ringGrad)" stroke-width="11" fill="none" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" filter="url(#ringGlow)"
        style="transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)"/></g>
    <text x="62" y="59" text-anchor="middle" class="disp" fill="#f6f5f2" font-size="27" font-weight="700">${big}</text>
    <text x="62" y="76" text-anchor="middle" fill="#67635e" font-size="9" letter-spacing="2.5" font-weight="600">KG NOW</text></svg>`; }
function sparkSvg(d){ const ws=d.map(x=>x.w),mn=Math.min(...ws),mx=Math.max(...ws),rg=(mx-mn)||1,W=380,H=94;
  const pt=(x,i)=>[i/(d.length-1)*W, H-(x.w-mn)/rg*(H-22)-11];
  const pts=d.map((x,i)=>pt(x,i).join(',')).join(' ');
  const first=pt(d[0],0), last=pt(d[d.length-1],d.length-1);
  const area=`${first[0]},${H} ${pts} ${last[0]},${H}`;
  const dots=d.map((x,i)=>{const[px,py]=pt(x,i);const isLast=i===d.length-1;
    return `<circle cx="${px}" cy="${py}" r="${isLast?4:2.5}" fill="${isLast?'#f8c04a':'var(--amber)'}" ${isLast?'filter="url(#sparkGlow)"':''}/>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:94px">
    <defs>
      <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--amber)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/>
      </linearGradient>
      <filter id="sparkGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <polygon points="${area}" fill="url(#sparkFill)"/>
    <polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>
    <div class="row xs mut2"><span>${d[0].date.slice(5)}</span><span>${d[d.length-1].date.slice(5)}</span></div>`; }

/* ============ PHOTO UPLOAD ============ */
function compress(file,cb){ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
  const max=900, sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
  c.width=img.width*sc; c.height=img.height*sc; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  cb(c.toDataURL('image/jpeg',0.8)); }; img.src=r.result; }; r.readAsDataURL(file); }
function handlePhoto(file,type){ const st=document.getElementById('phstatus'); if(!file) return;
  st.textContent='Uploading '+type+'…';
  compress(file,async(data)=>{ try{ const d=await api('uploadPhoto',{photo:{date:todayKey(),type:type,data:data}});
    st.textContent='✓ '+type+' saved.'; S.photos.push({date:todayKey(),type:type,url:d.url}); }
    catch(e){ st.textContent='Photo error: '+e.message; } }); }

      if(!S.today.ex[name])S.today.ex[name]={w:'',r:''};S.today.ex[name][f]=i.value;queueSave();});
    const dur=document.getElementById('duration'); if(dur) dur.onchange=()=>{S.today.duration=dur.value;queueSave();};
    document.querySelectorAll('.cexin').forEach(i=>i.oninput=()=>{const idx=+i.dataset.cex,f=i.dataset.f;
      if(!S.today.customEx[idx]) return; S.today.customEx[idx][f]=i.value; queueSave();});
    document.querySelectorAll('[data-rmcustom]').forEach(b=>b.onclick=()=>{
      S.today.customEx.splice(+b.dataset.rmcustom,1); queueSave(); render(); });
    const cexadd=document.getElementById('cexadd'); if(cexadd) cexadd.onclick=()=>{
      const name=document.getElementById('cexname').value.trim(); if(!name) return;
      if(!S.today.customEx) S.today.customEx=[];
      S.today.customEx.push({n:name,w:'',r:''}); document.getElementById('cexname').value='';
      queueSave(); render(); };
    document.getElementById('foodadd').onclick=()=>{
      const name=document.getElementById('foodpick').value.trim();
      const qty=parseFloat(document.getElementById('foodqty').value)||1;
      const item=FOOD_DB.find(f=>f.n.toLowerCase()===name.toLowerCase());
      if(!item){ document.getElementById('foodpick').style.boxShadow='0 0 0 1px var(--red)'; return; }
      if(!S.today.foods) S.today.foods=[];
      S.today.foods.push({n:item.n,u:item.u,k:item.k,p:item.p,qty:qty});
      document.getElementById('foodpick').value=''; document.getElementById('foodqty').value='1';
      queueSave(); render();
    };
    document.querySelectorAll('[data-rmfood]').forEach(b=>b.onclick=()=>{
      S.today.foods.splice(+b.dataset.rmfood,1); queueSave(); render();
    });
  }
  if(TAB==='progress'){
    document.getElementById('wsave').onclick=async()=>{const v=document.getElementById('wnow').value;if(!v)return;
      S.today.weight=v;S.profile.currentWeight=parseFloat(v);await api('saveDay',{day:S.today});await api('saveProfile',{profile:S.profile});await boot();};
    document.getElementById('msave').onclick=async()=>{const m={date:todayKey(),notes:''};
      document.querySelectorAll('.meas').forEach(i=>m[i.dataset.m]=i.value);await api('saveMeasure',{measure:m});S.measurements.unshift(m);flashSaved();};
    [['phF','front'],['phS','side'],['phB','back']].forEach(([id,t])=>{const el=document.getElementById(id);if(el)el.onchange=e=>handlePhoto(e.target.files[0],t);});
  }
  if(TAB==='report'){
    document.getElementById('copyrep').onclick=async()=>{
      const txt=document.getElementById('reptext').value;
      try{ await navigator.clipboard.writeText(txt); }catch(e){ const ta=document.getElementById('reptext'); ta.focus(); ta.select(); document.execCommand('copy'); }
      flashSaved();
    };
  }
  if(TAB==='plan'){
    document.getElementById('review').onclick=()=>{TAB='report';render();};
    document.getElementById('sdate').onchange=async e=>{S.profile.startDate=e.target.value;await api('saveProfile',{profile:S.profile});render();};
    document.getElementById('skiptr').onclick=async()=>{S.profile.skipTrainer=!S.profile.skipTrainer;await api('saveProfile',{profile:S.profile});render();};
    document.getElementById('psave').onclick=async()=>{S.profile.currentWeight=parseFloat(document.getElementById('pcur').value)||S.profile.currentWeight;
      S.profile.startWeight=parseFloat(document.getElementById('pstart').value)||S.profile.startWeight;await api('saveProfile',{profile:S.profile});flashSaved();render();};
    document.getElementById('reseturl').onclick=()=>{localStorage.removeItem(LS_URL);API_URL='';renderSetup();};
    document.getElementById('calcRun').onclick=async()=>{
      const h=parseFloat(document.getElementById('calcH').value)||173;
      const w=parseFloat(document.getElementById('calcW').value)||70;
      const age=parseFloat(document.getElementById('calcAge').value)||25;
      const act=parseFloat(document.getElementById('calcAct').value)||1.55;
      const bmi=(w/((h/100)**2)).toFixed(1);
      const bmr=Math.round(10*w+6.25*h-5*age+5);
      const tdee=Math.round(bmr*act);
      const cutCal=tdee-500;
      let bmiCat='Normal', bmiColor='var(--green)';
      if(bmi<18.5){bmiCat='Underweight';bmiColor='var(--amber)';}
      else if(bmi>=25&&bmi<30){bmiCat='Overweight';bmiColor='var(--amber)';}
      else if(bmi>=30){bmiCat='Obese';bmiColor='var(--red)';}
      document.getElementById('calcOut').innerHTML=`
        <div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="sm">BMI</span><span class="disp" style="font-size:18px;color:${bmiColor}">${bmi} · ${bmiCat}</span></div>
        <div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="sm">BMR (at rest)</span><span class="disp" style="font-size:18px">${bmr} kcal</span></div>
        <div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="sm">TDEE (maintenance)</span><span class="disp" style="font-size:18px">${tdee} kcal</span></div>
        <div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span class="sm">Fat-loss target</span><span class="disp" style="font-size:18px;color:var(--amber)">${cutCal} kcal</span></div>
        <p class="xs mut2" style="margin-top:4px">Estimate only, not medical data. Your diet plan (~2000 kcal) already accounts for this.</p>`;
      S.profile.heightCm=h; S.profile.age=age;
      try{ await api('saveProfile',{profile:S.profile}); }catch(e){}
    };
  }
  if(TAB==='goals'){
    document.getElementById('gsave').onclick=async()=>{
      S.profile.goals={
        weight:document.getElementById('gWeight').value,
        bench:document.getElementById('gBench').value,
        squat:document.getElementById('gSquat').value,
        pullups:document.getElementById('gPullups').value,
        monthlyWorkouts:document.getElementById('gMonthly').value,
      };
      await api('saveProfile',{profile:S.profile}); flashSaved(); render();
    };
    document.getElementById('pullupsSave').onclick=async()=>{
      S.profile.pullupsMax=document.getElementById('pullupsNow').value;
      S.profile.pullupsDate=todayKey();
      await api('saveProfile',{profile:S.profile}); flashSaved(); render();
    };
  }
}
function bindNav(){ document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();}); }
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* ============ SETUP SCREEN ============ */
function renderSetup(err){
  document.getElementById('nav').style.display='none';
  document.getElementById('app').innerHTML=`<div class="wrap" style="padding-top:18vh">
    <div class="eyebrow" style="color:var(--amber)">Iron Log</div>
    <div class="disp" style="font-size:34px;margin:4px 0 18px">First-time setup</div>
    ${err?`<div class="card" style="border-color:var(--red)"><span class="sm" style="color:var(--red)">${err}</span></div>`:''}
    <div class="card">
      <p class="sm mut" style="margin-bottom:12px">Paste your Apps Script Web App URL (the /exec link from the setup guide).</p>
      <input id="urlin" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="btn amber" id="urlsave" style="margin-top:12px">Connect</button>
    </div>
    <p class="xs mut2" style="text-align:center">Follow the setup guide to get this URL once. After that the app just works.</p>
  </div>`;
  document.getElementById('urlsave').onclick=()=>{const v=document.getElementById('urlin').value.trim();
    if(!v){return;} localStorage.setItem(LS_URL,v); API_URL=v; document.getElementById('app').innerHTML='<div class="wrap" style="padding-top:40vh;text-align:center;color:var(--mut2)">Connecting…</div>'; boot();};
}

boot();
</script>
</body>
</html>
